name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Stage Tiny Tapeout documentation
        run: |
          mkdir -p docs
          cp experiments/docs/* docs/

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttgf26a
